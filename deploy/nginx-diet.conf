# 部署于已有服务器（多项目共存）的子域名反代模板
# 用法：放到 /etc/nginx/conf.d/ 或 sites-enabled/，改 server_name 与 root 路径后 reload
# 前置：前端已 build（frontend/dist），后端由 Gunicorn/Uvicorn 跑在 127.0.0.1:8100

server {
    listen 80;
    server_name diet.yourdomain.com;   # ← 改成你的子域名

    # 前端静态产物
    root /opt/opc-diet-advisor/frontend/dist;
    index index.html;
    location / {
        try_files $uri /index.html;
    }

    # 后端 API 反代（仅本机，不暴露公网端口）
    location /api/ {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

# HTTPS：certbot --nginx -d diet.yourdomain.com 自动改写并拿证书
